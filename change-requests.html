<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>목표 변경요청 | 대교홀딩스 SMART</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="js/design.css" />
<script src="js/config.js"></script>
</head>
<body class="min-h-screen">
<div id="nav-root"></div>
<div class="max-w-4xl mx-auto px-4 py-7">
  <div class="mb-4">
    <h1 class="page-title">목표 변경요청</h1>
    <p class="page-sub">확정된 목표의 값을 바꿔야 할 때 사유와 함께 요청합니다.</p>
  </div>

  <!-- 사업계획 화면군의 한 탭으로 묶는다 (예전에는 별도 메뉴였다) -->
  <div class="tabs">
    <a href="goals.html?tab=mine" class="tab">내 차례</a>
    <a href="goals.html?tab=draft" class="tab">작성 중</a>
    <a href="goals.html?tab=approved" class="tab">확정</a>
    <a href="goals.html?tab=all" class="tab">전체</a>
    <span class="tab active">변경요청</span>
  </div>

  <div class="space-y-6">

  <div id="create-section" class="card p-5 hidden">
    <h2 class="font-medium text-slate-800 mb-3">새 변경요청 작성 <span id="create-goal-name" class="text-sm text-slate-500"></span></h2>
    <label class="field-label">변경 사유</label>
    <textarea id="reason" rows="2" placeholder="예: 상반기 수주 지연으로 하반기 목표를 현실화" class="w-full border border-slate-300 rounded px-3 py-2 text-sm"></textarea>
    <p class="field-hint mb-3">필수는 아니지만, 사유가 없으면 지주사에서 판단하기 어려워 처리가 늦어집니다.</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm" id="field-grid"></div>

    <div id="metric-section" class="mt-5 hidden">
      <h3 class="text-sm font-medium text-slate-700 mb-2">핵심지표(KPI) 변경</h3>
      <div id="metric-grid" class="space-y-4"></div>
    </div>

    <p class="text-xs text-slate-400 my-2">비워둔 항목은 기존 값을 유지합니다.</p>
    <button id="submit-cr" class="btn btn-primary !text-sm">변경요청 제출</button>
  </div>

  <template id="field-block-tpl">
    <div>
      <label class="flex items-center gap-1.5 text-xs font-medium text-slate-500 mb-1">
        <input type="checkbox" class="field-check" />
        <span class="field-label"></span>
      </label>
      <p class="text-xs rounded p-2 mb-1 field-current" style="background:var(--surface-hover);color:var(--text-secondary)"></p>
      <textarea class="field-input w-full border border-slate-300 rounded px-2 py-1.5" placeholder="변경 후 값 입력" disabled></textarea>
    </div>
  </template>

  <div>
    <h2 class="font-medium text-slate-800 mb-2">변경요청 목록</h2>
    <div id="list-root" class="space-y-3"></div>
  </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/nav.js"></script>
<script>
let PROFILE;
const params = new URLSearchParams(location.search);
const GOAL_ID = params.get("goal");

// 변경요청 작성 시점의 "현재 값"을 기억해두기 위한 캐시. 합의되면 원본 행이 새 값으로
// 덮어써지므로, 합의 이후에도 "변경 전" 값을 정확히 보여주려면 요청 제출 시점에
// 이 값들을 함께 저장해둬야 한다 (previous_* 컬럼).
let CURRENT_GOAL = null;
let CURRENT_METRICS_BY_ID = {};
let CURRENT_PERIOD_TARGETS_BY_METRIC = {};
let CURRENT_PROGRESS_BY_METRIC = {}; // 지표별 기간별 실적 (변경 판단 근거로 함께 보여준다)

const FIELD_DEFS = [
  { key: "strategy_name", label: "전략(목표)" },
  { key: "specific_text", label: "S · Specific" },
  { key: "measurable_text", label: "M · Measurable" },
  { key: "achievable_text", label: "A · Achievable" },
  { key: "relevant_text", label: "R · Relevant" },
  { key: "timebound_text", label: "T · Time-bound" },
];

// 지표명·유형·단위·집계방식은 KPI 기준정보(kpi_definitions)에서 관리한다.
// 변경요청으로 바꾸면 이 목표에만 반영되어 연도별 비교가 어긋나므로 여기서는 다루지 않는다.
const METRIC_FIELD_DEFS = [
  { key: "baseline_value", label: "시작값(작년 실적)", type: "number" },
  { key: "target_value", label: "목표값", type: "number" },
  { key: "period_type", label: "기간 유형", type: "select", options: Object.entries(PERIOD_TYPE_LABEL) },
];

(async function init() {
  PROFILE = await requireAuth();
  if (!PROFILE) return;
  renderNav(PROFILE, "plan");
  if (GOAL_ID && !isHoldco(PROFILE)) {
    const { data: goal } = await sb.from("goals").select("*").eq("id", GOAL_ID).single();
    if (goal) {
      CURRENT_GOAL = goal;
      document.getElementById("create-section").classList.remove("hidden");
      document.getElementById("create-goal-name").textContent = "· " + goal.strategy_name;
      renderFieldGrid(goal);
      const { data: metrics } = await sb.from("goal_metrics").select("*").eq("goal_id", GOAL_ID);
      (metrics||[]).forEach(m => CURRENT_METRICS_BY_ID[m.id] = m);
      const metricIds = (metrics||[]).map(x => x.id);
      let periodTargetsByMetric = {};
      if (metricIds.length) {
        const { data: pts } = await sb.from("goal_period_targets").select("*").in("goal_metric_id", metricIds);
        (pts||[]).forEach(p => {
          if (!periodTargetsByMetric[p.goal_metric_id]) periodTargetsByMetric[p.goal_metric_id] = {};
          periodTargetsByMetric[p.goal_metric_id][p.period] = p.target_value;
        });
      }
      CURRENT_PERIOD_TARGETS_BY_METRIC = periodTargetsByMetric;

      // 목표값을 얼마로 바꿀지 판단하려면 지금까지의 실적이 같이 보여야 한다
      if (metricIds.length) {
        const { data: entries } = await sb.from("progress_entries")
          .select("goal_metric_id, period, actual_value, milestone_achieved").in("goal_metric_id", metricIds);
        (entries || []).forEach(e => {
          if (!CURRENT_PROGRESS_BY_METRIC[e.goal_metric_id]) CURRENT_PROGRESS_BY_METRIC[e.goal_metric_id] = {};
          CURRENT_PROGRESS_BY_METRIC[e.goal_metric_id][e.period] = e;
        });
      }
      renderMetricGrid(metrics, periodTargetsByMetric);
    }
  }
  await load();
})();

// 기간(YYYY-MM 또는 YYYY-Qn)을 "N월"/"N분기" 형태로 보기 좋게 변환
function periodLabel(period) {
  const monthMatch = period.match(/-(\d{2})$/);
  if (monthMatch) return `${parseInt(monthMatch[1], 10)}월`;
  const qMatch = period.match(/-Q(\d)$/);
  if (qMatch) return `${qMatch[1]}분기`;
  return period;
}

function periodTargetGridHtml(m, ptMap) {
  // 변경요청은 항상 특정 기존 목표에 대한 것이므로, 사이드바에서 보고 있는 연도가 아니라
  // 그 목표 본래의 연도를 기준으로 기간 목록을 만든다.
  const periods = periodsForYear(CURRENT_GOAL.year, m.period_type);
  const unit = m.unit ? ` ${m.unit}` : "";
  const progress = CURRENT_PROGRESS_BY_METRIC[m.id] || {};

  return periods.map((p, idx) => {
    const set = ptMap && ptMap[p] !== undefined && ptMap[p] !== null;
    // 기간별 목표가 없으면 공용 규칙(referencePeriodTarget)으로 계산한 참고값을 보여준다 (실제 설정값이 아님)
    let currentHtml;
    if (set) {
      currentHtml = `<span class="font-medium text-slate-700">${Number(ptMap[p]).toLocaleString()}${unit}</span>`;
    } else {
      const ref = referencePeriodTarget(m, idx, periods.length);
      currentHtml = ref === null
        ? `<span class="text-slate-400">미설정</span>`
        : `<span class="text-slate-400">미설정 · 연간기준 ${ref.toLocaleString()}${unit}</span>`;
    }

    const entry = progress[p];
    const actual = entry && entry.actual_value !== null && entry.actual_value !== undefined
      ? `<p class="text-[10px] text-blue-600 mb-0.5">실적 ${Number(entry.actual_value).toLocaleString()}${unit}</p>` : "";

    return `<div class="border border-slate-200 rounded p-1.5">
      <p class="text-[10px] text-slate-400 mb-0.5">${periodLabel(p)}</p>
      <p class="text-[10px] rounded px-1 py-0.5 mb-0.5" style="background:var(--surface-hover)">${currentHtml}</p>
      ${actual}
      <input type="number" step="any" class="mp-input w-full border border-slate-300 rounded px-1 py-0.5 text-xs" data-period="${p}" placeholder="변경 후" />
    </div>`;
  }).join("");
}

function metricCurrentDisplay(m, key) {
  if (key === "metric_type") return escapeHtml(METRIC_TYPE_LABEL[m.metric_type] || m.metric_type || "-");
  if (key === "period_type") return PERIOD_TYPE_LABEL[m.period_type] || m.period_type;
  const v = m[key];
  return (v === null || v === undefined || v === "") ? '<span style="color:var(--text-tertiary)">입력된 내용 없음</span>' : escapeHtml(String(v));
}

function metricInputHtml(f, m) {
  if (f.type === "select") {
    const opts = f.options.map(([val, label]) => `<option value="${val}" ${m[f.key]===val?'selected':''}>${escapeHtml(label)}</option>`).join("");
    return `<select class="mf-input w-full border border-slate-300 rounded px-2 py-1.5 text-sm" disabled>${opts}</select>`;
  }
  const type = f.type === "number" ? "number" : "text";
  return `<input type="${type}" step="any" class="mf-input w-full border border-slate-300 rounded px-2 py-1.5 text-sm" placeholder="변경 후 값 입력" disabled />`;
}

// 지표의 현재 상태를 한 줄로 요약한다. 목표값을 얼마로 바꿀지 판단하려면
// 지금 목표가 얼마인지, 집계 방식이 뭔지, 실적이 어디까지 왔는지가 같이 보여야 한다.
function metricSummaryHtml(m) {
  const unit = m.unit ? ` ${m.unit}` : "";
  const isNumeric = (m.metric_type === "increasing" || m.metric_type === "decreasing");
  const progress = CURRENT_PROGRESS_BY_METRIC[m.id] || {};
  const entriesAsc = periodsForYear(CURRENT_GOAL.year, m.period_type).map(p => progress[p]).filter(Boolean);

  const parts = [`${METRIC_TYPE_LABEL[m.metric_type]}`];
  if (isNumeric) parts.push(ACCUMULATION_LABEL[accumulationOf(m)]);
  parts.push(PERIOD_TYPE_LABEL[m.period_type] || m.period_type);

  const targets = [];
  if (isNumeric) {
    targets.push(m.baseline_value !== null && m.baseline_value !== undefined
      ? `시작값 ${Number(m.baseline_value).toLocaleString()}${unit}` : "시작값 미설정");
    targets.push(m.target_value !== null && m.target_value !== undefined
      ? `연간 목표 ${Number(m.target_value).toLocaleString()}${unit}` : "연간 목표 미설정");
  }

  const actual = isNumeric ? annualActual(m, entriesAsc) : null;
  const rate = achievementRate(m, entriesAsc, CURRENT_PERIOD_TARGETS_BY_METRIC[m.id] || {}, CURRENT_GOAL.year);
  const progressText = entriesAsc.length
    ? `현재 실적 ${actual !== null ? Number(actual).toLocaleString() + unit : "-"}${rate !== null ? ` · 달성률 ${rate}%` : ""} (${entriesAsc.length}개 기간 입력됨)`
    : "아직 입력된 실적이 없습니다";

  return `<div class="rounded p-2 mb-2 text-[11px]" style="background:var(--surface-hover);color:var(--text-secondary)">
    <p>${escapeHtml(parts.join(" · "))}</p>
    ${targets.length ? `<p class="mt-0.5">${escapeHtml(targets.join(" → "))}</p>` : ""}
    <p class="mt-0.5 ${entriesAsc.length ? "text-blue-600" : "text-slate-400"}">${escapeHtml(progressText)}</p>
    ${entriesAsc.length ? `<p class="mt-0.5 text-amber-600">목표값을 바꾸면 이미 입력된 실적의 달성률이 모두 다시 계산됩니다.</p>` : ""}
  </div>`;
}

function renderMetricGrid(metrics, periodTargetsByMetric) {
  const section = document.getElementById("metric-section");
  const root = document.getElementById("metric-grid");
  if (!metrics || metrics.length === 0) { section.classList.add("hidden"); root.innerHTML = ""; return; }
  section.classList.remove("hidden");
  root.innerHTML = metrics.map(m => {
    const isNumeric = (m.metric_type === "increasing" || m.metric_type === "decreasing");
    const ptMap = (periodTargetsByMetric && periodTargetsByMetric[m.id]) || {};
    return `
    <div class="border border-slate-200 rounded p-3" data-metric-id="${m.id}">
      <p class="text-sm font-medium text-slate-800 mb-1">핵심지표: ${escapeHtml(m.metric_name)}</p>
      ${metricSummaryHtml(m)}
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
        ${METRIC_FIELD_DEFS.map(f => `
          <div data-field-wrap="${f.key}">
            <label class="flex items-center gap-1.5 text-xs font-medium text-slate-500 mb-1">
              <input type="checkbox" class="mf-check" data-field="${f.key}" />
              <span>${f.label} (현재 값)</span>
            </label>
            <p class="text-xs rounded p-2 mb-1" style="background:var(--surface-hover);color:var(--text-secondary)">${metricCurrentDisplay(m, f.key)}</p>
            ${metricInputHtml(f, m)}
          </div>
        `).join("")}
      </div>
      ${isNumeric ? `
      <div class="mt-3 border-t border-slate-200 pt-2">
        <p class="text-xs font-medium text-slate-500 mb-2">월별/분기별 목표값 변경 <span class="font-normal text-slate-400">(변경할 기간만 입력, 나머지는 비워두면 유지)</span></p>
        <div class="mp-grid grid grid-cols-3 sm:grid-cols-4 gap-2">${periodTargetGridHtml(m, ptMap)}</div>
      </div>` : ''}
    </div>`;
  }).join("");
  root.querySelectorAll(".mf-check").forEach(cb => {
    cb.addEventListener("change", () => {
      const wrap = cb.closest("[data-field-wrap]");
      const input = wrap.querySelector(".mf-input");
      input.disabled = !cb.checked;
      input.classList.toggle("opacity-50", !cb.checked);
      if (cb.checked) input.focus();
      else input.value = "";
    });
  });
}

function renderFieldGrid(goal) {
  const grid = document.getElementById("field-grid");
  const tpl = document.getElementById("field-block-tpl");
  grid.innerHTML = "";
  FIELD_DEFS.forEach(f => {
    const node = tpl.content.cloneNode(true);
    const wrap = node.querySelector("div");
    wrap.dataset.field = f.key;
    node.querySelector(".field-label").textContent = f.label + " (현재 값)";
    node.querySelector(".field-current").innerHTML = nl2br(goal[f.key]) || '<span style="color:var(--text-tertiary)">입력된 내용 없음</span>';
    const checkbox = node.querySelector(".field-check");
    const textarea = node.querySelector(".field-input");
    checkbox.addEventListener("change", () => {
      textarea.disabled = !checkbox.checked;
      textarea.classList.toggle("opacity-50", !checkbox.checked);
      if (checkbox.checked) textarea.focus();
      else textarea.value = "";
    });
    grid.appendChild(node);
  });
}

document.getElementById("submit-cr")?.addEventListener("click", async () => {
  const proposed = {};
  const previous = {};
  const proposedMetrics = {};
  const previousMetrics = {};
  let missingValue = false;
  document.querySelectorAll("#field-grid > div").forEach(wrap => {
    const checked = wrap.querySelector(".field-check").checked;
    if (!checked) return;
    const v = wrap.querySelector(".field-input").value.trim();
    if (!v) { missingValue = true; return; }
    proposed[wrap.dataset.field] = v;
    previous[wrap.dataset.field] = CURRENT_GOAL ? (CURRENT_GOAL[wrap.dataset.field] ?? null) : null;
  });
  const proposedPeriodChanges = {};
  const previousPeriodChanges = {};
  document.querySelectorAll("#metric-grid > div[data-metric-id]").forEach(card => {
    const metricId = card.dataset.metricId;
    const fields = {};
    const prevFields = {};
    card.querySelectorAll("[data-field-wrap]").forEach(wrap => {
      const checkbox = wrap.querySelector(".mf-check");
      if (!checkbox.checked) return;
      const v = wrap.querySelector(".mf-input").value;
      if (v === null || String(v).trim() === "") { missingValue = true; return; }
      fields[checkbox.dataset.field] = v;
      const curMetric = CURRENT_METRICS_BY_ID[metricId];
      prevFields[checkbox.dataset.field] = curMetric ? (curMetric[checkbox.dataset.field] ?? null) : null;
    });
    if (Object.keys(fields).length) { proposedMetrics[metricId] = fields; previousMetrics[metricId] = prevFields; }

    // 기간별 목표값은 체크박스 없이 항상 입력 가능하다. 값을 적은 기간만 변경 대상으로 본다.
    const periods = {};
    const prevPeriods = {};
    const curPtMap = CURRENT_PERIOD_TARGETS_BY_METRIC[metricId] || {};
    card.querySelectorAll(".mp-input").forEach(inp => {
      const v = inp.value;
      if (v !== "" && v !== null) {
        periods[inp.dataset.period] = v;
        prevPeriods[inp.dataset.period] = curPtMap[inp.dataset.period] ?? null;
      }
    });
    if (Object.keys(periods).length) { proposedPeriodChanges[metricId] = periods; previousPeriodChanges[metricId] = prevPeriods; }
  });
  if (missingValue) { toastError("변경 체크한 항목에는 변경 후 값을 입력해주세요."); return; }
  if (Object.keys(proposed).length === 0 && Object.keys(proposedMetrics).length === 0 && Object.keys(proposedPeriodChanges).length === 0) { toastError("변경할 항목을 하나 이상 체크하고 값을 입력해주세요."); return; }

  // 사유는 필수가 아니지만, 비어 있으면 한 번 더 묻는다 (지주사에서 판단할 근거가 없기 때문)
  if (!document.getElementById("reason").value.trim() &&
      !confirm("변경 사유가 비어 있습니다.\n사유가 없으면 지주사에서 판단하기 어려워 처리가 늦어질 수 있습니다.\n\n이대로 제출할까요?")) {
    document.getElementById("reason").focus();
    return;
  }

  const { error } = await sb.from("change_requests").insert({
    goal_id: GOAL_ID, requested_by: PROFILE.id,
    reason: document.getElementById("reason").value,
    proposed_changes: proposed,
    previous_changes: Object.keys(previous).length ? previous : null,
    proposed_metric_changes: Object.keys(proposedMetrics).length ? proposedMetrics : null,
    previous_metric_changes: Object.keys(previousMetrics).length ? previousMetrics : null,
    proposed_period_target_changes: Object.keys(proposedPeriodChanges).length ? proposedPeriodChanges : null,
    previous_period_target_changes: Object.keys(previousPeriodChanges).length ? previousPeriodChanges : null
  });
  if (error) { toastError("제출 실패: " + error.message); return; }
  toastOk("변경요청이 제출되었습니다.");
  window.location.href = "goal-detail.html?id=" + GOAL_ID;
});

// ============================================================
//  변경요청 목록 — 관리자가 '합의할지 말지'를 이 화면에서 결정할 수 있어야 한다
// ============================================================
// 그러려면 세 가지가 한눈에 보여야 한다: 무엇이 어떻게 바뀌는지(전·후와 변화폭),
// 왜 바꾸는지(사유), 바꾸면 무엇이 흔들리는지(이미 입력된 실적과 달성률).
let LIST_METRICS = {};        // metric_id → goal_metrics
let LIST_PT = {};             // metric_id → { period: target }
let LIST_ENTRIES = {};        // metric_id → [progress_entries]

function fmtNum(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return isNaN(n) ? String(v) : n.toLocaleString();
}

// 숫자 변화는 폭까지 적어준다. 1000 → 1300 만 보고는 크게 바뀐 건지 알기 어렵다.
function deltaHtml(oldRaw, newRaw) {
  const a = Number(oldRaw), b = Number(newRaw);
  if (oldRaw === null || oldRaw === undefined || oldRaw === "" || isNaN(a) || isNaN(b)) return "";
  const diff = b - a;
  if (diff === 0) return `<span class="diff-delta" style="color:var(--text-tertiary)">변화 없음</span>`;
  const pct = a === 0 ? null : Math.round((diff / Math.abs(a)) * 1000) / 10;
  const color = diff > 0 ? "var(--green)" : "var(--red)";
  const sign = diff > 0 ? "+" : "";
  return `<span class="diff-delta" style="color:${color}">${sign}${diff.toLocaleString()}${pct !== null ? ` (${sign}${pct}%)` : ""}</span>`;
}

function diffRowHtml(label, oldDisplay, newDisplay, delta) {
  return `<div class="diff-row">
    <div>
      <p class="diff-field">${label}</p>
      <div class="diff-box diff-before">${oldDisplay}</div>
    </div>
    <div class="text-center">
      <span class="diff-arrow">→</span>
      <div class="mt-0.5">${delta || ""}</div>
    </div>
    <div>
      <p class="diff-field">&nbsp;</p>
      <div class="diff-box diff-after">${newDisplay}</div>
    </div>
  </div>`;
}

// 목표값을 바꾸면 이미 입력된 실적의 달성률이 전부 다시 계산된다.
// 바뀐 뒤의 달성률을 미리 보여줘야 "이 변경이 타당한가"를 판단할 수 있다.
function impactHtml(cr) {
  const year = cr.goals && cr.goals.year;
  if (!year) return "";
  const touched = new Set([
    ...Object.keys(cr.proposed_metric_changes || {}),
    ...Object.keys(cr.proposed_period_target_changes || {})
  ]);
  const lines = [];
  touched.forEach(metricId => {
    const m = LIST_METRICS[metricId];
    if (!m) return;
    const entries = (LIST_ENTRIES[metricId] || []).slice()
      .sort((a, b) => (a.period < b.period ? -1 : 1));
    if (!entries.length) return;

    const ptNow = LIST_PT[metricId] || {};
    const rateNow = achievementRate(m, entries, ptNow, year);

    // 변경이 적용된 모습을 만들어 달성률을 다시 계산한다
    const after = Object.assign({}, m, (cr.proposed_metric_changes || {})[metricId] || {});
    if (after.target_value !== undefined && after.target_value !== null) after.target_value = Number(after.target_value);
    if (after.baseline_value !== undefined && after.baseline_value !== null && after.baseline_value !== "") after.baseline_value = Number(after.baseline_value);
    const ptAfter = Object.assign({}, ptNow, (cr.proposed_period_target_changes || {})[metricId] || {});
    const rateAfter = achievementRate(after, entries, ptAfter, year);

    const name = metricNameOf(m);
    if (rateNow === null && rateAfter === null) {
      lines.push(`${name}: 실적 ${entries.length}건이 영향을 받습니다`);
    } else {
      lines.push(`${name}: 달성률 ${rateNow === null ? "-" : rateNow + "%"} → <b>${rateAfter === null ? "-" : rateAfter + "%"}</b> (실적 ${entries.length}건 재계산)`);
    }
  });
  if (!lines.length) return "";
  return `<div class="warn-note mt-3"><span>⚠</span><span>${lines.join("<br/>")}</span></div>`;
}

// 변경 항목을 한 종류로 모은다 (목표 본문 / 지표 속성 / 기간별 목표값)
function changeRowsHtml(cr) {
  const goal = cr.goals || {};
  const rows = [];

  Object.entries(cr.proposed_changes || {}).forEach(([key, newVal]) => {
    const def = FIELD_DEFS.find(f => f.key === key);
    const label = def ? def.label : key;
    const has = cr.previous_changes && Object.prototype.hasOwnProperty.call(cr.previous_changes, key);
    const oldVal = has ? cr.previous_changes[key] : goal[key];
    rows.push(diffRowHtml(escapeHtml(label),
      nl2br(oldVal) || '<span style="opacity:.6">(없음)</span>', nl2br(newVal), ""));
  });

  Object.entries(cr.proposed_metric_changes || {}).forEach(([metricId, fields]) => {
    const m = LIST_METRICS[metricId];
    const unit = m ? (m.unit ? ` ${m.unit}` : "") : "";
    const metricLabel = m ? metricNameOf(m) : "(삭제된 지표)";
    const prevFields = (cr.previous_metric_changes && cr.previous_metric_changes[metricId]) || null;
    Object.entries(fields).forEach(([key, newVal]) => {
      const def = METRIC_FIELD_DEFS.find(f => f.key === key);
      const label = `${metricLabel} · ${def ? def.label : key}`;
      const has = prevFields && Object.prototype.hasOwnProperty.call(prevFields, key);
      const oldRaw = has ? prevFields[key] : (m ? m[key] : undefined);
      let oldD, newD, delta = "";
      if (key === "period_type") {
        oldD = oldRaw ? escapeHtml(PERIOD_TYPE_LABEL[oldRaw] || oldRaw) : "(없음)";
        newD = escapeHtml(PERIOD_TYPE_LABEL[newVal] || newVal);
      } else {
        oldD = fmtNum(oldRaw) !== null ? escapeHtml(fmtNum(oldRaw) + unit) : '<span style="opacity:.6">(없음)</span>';
        newD = escapeHtml((fmtNum(newVal) ?? String(newVal)) + unit);
        delta = deltaHtml(oldRaw, newVal);
      }
      rows.push(diffRowHtml(escapeHtml(label), oldD, newD, delta));
    });
  });

  Object.entries(cr.proposed_period_target_changes || {}).forEach(([metricId, periods]) => {
    const m = LIST_METRICS[metricId];
    const unit = m ? (m.unit ? ` ${m.unit}` : "") : "";
    const metricLabel = m ? metricNameOf(m) : "(삭제된 지표)";
    const prevPeriods = (cr.previous_period_target_changes && cr.previous_period_target_changes[metricId]) || null;
    Object.entries(periods).forEach(([period, newVal]) => {
      const has = prevPeriods && Object.prototype.hasOwnProperty.call(prevPeriods, period);
      const oldVal = has ? prevPeriods[period] : (LIST_PT[metricId] || {})[period];
      const oldD = fmtNum(oldVal) !== null ? escapeHtml(fmtNum(oldVal) + unit)
        : '<span style="opacity:.6">(미설정 · 연간 목표로 계산)</span>';
      rows.push(diffRowHtml(
        escapeHtml(`${metricLabel} · ${periodDisplayLabel(period)} 목표값`),
        oldD, escapeHtml((fmtNum(newVal) ?? String(newVal)) + unit), deltaHtml(oldVal, newVal)));
    });
  });

  return rows;
}

async function load() {
  const { data, error } = await sb.from("change_requests")
    .select("*, goals:goal_id(id, year, strategy_name, status, specific_text, measurable_text, achievable_text, relevant_text, timebound_text, companies:company_id(name), business_units:business_unit_id(name)), requester:requested_by(name,email), reviewer:reviewed_by(name,email)")
    .order("created_at", { ascending: false });
  if (error) { console.error(error); return; }

  // 영향을 계산하려면 지표·기간목표·실적이 모두 필요하다
  const metricIds = new Set();
  (data || []).forEach(cr => {
    Object.keys(cr.proposed_metric_changes || {}).forEach(id => metricIds.add(id));
    Object.keys(cr.proposed_period_target_changes || {}).forEach(id => metricIds.add(id));
  });
  LIST_METRICS = {}; LIST_PT = {}; LIST_ENTRIES = {};
  if (metricIds.size) {
    const ids = Array.from(metricIds);
    const [{ data: metrics }, { data: pts }, { data: entries }] = await Promise.all([
      sb.from("goal_metrics").select("*, kpi_definitions:kpi_definition_id(name,unit)").in("id", ids),
      sb.from("goal_period_targets").select("*").in("goal_metric_id", ids),
      sb.from("progress_entries").select("goal_metric_id,period,actual_value,milestone_achieved").in("goal_metric_id", ids)
    ]);
    (metrics || []).forEach(m => { LIST_METRICS[m.id] = m; });
    (pts || []).forEach(p => { (LIST_PT[p.goal_metric_id] = LIST_PT[p.goal_metric_id] || {})[p.period] = p.target_value; });
    (entries || []).forEach(e => { (LIST_ENTRIES[e.goal_metric_id] = LIST_ENTRIES[e.goal_metric_id] || []).push(e); });
  }

  const all = data || [];
  const pending = all.filter(cr => cr.status === "pending");
  const done = all.filter(cr => cr.status !== "pending");

  const root = document.getElementById("list-root");
  if (!all.length) {
    root.innerHTML = emptyStateHtml("변경요청이 없습니다",
      "확정된 목표의 값을 바꿔야 할 때, 목표 상세 화면에서 변경요청을 올릴 수 있습니다.",
      [{ label: "확정 목표 보기", href: "goals.html?tab=approved" }]);
    return;
  }

  root.innerHTML = `
    ${pending.length ? `<p class="text-[13px] font-semibold mb-2" style="color:var(--red)">결정을 기다리는 요청 ${pending.length}건</p>
      <div class="space-y-3 mb-6">${pending.map(crCardHtml).join("")}</div>` :
      `<div class="all-done mb-6"><p class="msg">결정을 기다리는 변경요청이 없습니다</p></div>`}
    ${done.length ? `<details>
      <summary class="text-[13px] font-semibold cursor-pointer mb-2" style="color:var(--text-secondary)">처리된 요청 ${done.length}건 보기</summary>
      <div class="space-y-3 mt-2">${done.map(crCardHtml).join("")}</div>
    </details>` : ""}`;
}

function crCardHtml(cr) {
  const canDecide = isHoldcoEditor(PROFILE) && cr.status === "pending";
  const goal = cr.goals || {};
  const rows = changeRowsHtml(cr);
  const statusChip = {
    pending: `<span class="badge" style="background:var(--amber-soft);color:var(--amber)">결정 대기</span>`,
    approved: `<span class="badge" style="background:var(--green-soft);color:var(--green)">반영됨</span>`,
    rejected: `<span class="badge" style="background:var(--red-soft);color:var(--red)">반려됨</span>`
  }[cr.status];

  const who = cr.requester ? escapeHtml(cr.requester.name || cr.requester.email) : "-";
  const when = new Date(cr.created_at).toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" });
  const reviewed = cr.reviewed_at
    ? `<p class="text-[11.5px] mt-3" style="color:var(--text-tertiary)">처리: ${cr.reviewer ? escapeHtml(cr.reviewer.name || cr.reviewer.email) : "-"} · ${new Date(cr.reviewed_at).toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" })}</p>`
      + (cr.review_comment ? `<p class="text-[12px] mt-1" style="color:var(--text-secondary)">처리 의견: ${escapeHtml(cr.review_comment)}</p>` : "")
    : "";

  return `<div class="card p-5">
    <div class="flex items-start justify-between gap-3 mb-3">
      <div class="min-w-0">
        <div class="text-[11.5px]" style="color:var(--text-tertiary)">
          ${escapeHtml(goal.companies?.name || "")} · ${escapeHtml(goal.business_units?.name || "사업부 미지정")}
          ${goal.year ? ` · ${goal.year}년` : ""}
        </div>
        <div class="text-[15px] font-semibold mt-0.5" style="color:var(--text-primary)">${escapeHtml(goal.strategy_name || "")}</div>
        <div class="text-[11.5px] mt-1" style="color:var(--text-tertiary)">요청 ${who} · ${when}</div>
      </div>
      <div class="shrink-0 text-right">
        ${statusChip}
        ${goal.id ? `<a href="goal-detail.html?id=${goal.id}" class="block text-[11.5px] mt-1.5 underline" style="color:var(--text-secondary)">목표 보기</a>` : ""}
      </div>
    </div>

    <p class="text-[11px] font-semibold mb-1.5" style="color:var(--text-tertiary)">변경 사유</p>
    <div class="reason-box ${cr.reason && cr.reason.trim() ? "" : "empty"} mb-4">
      ${cr.reason && cr.reason.trim() ? nl2br(cr.reason) : "사유가 적혀 있지 않습니다. 필요하면 요청자에게 확인한 뒤 결정하세요."}
    </div>

    <p class="text-[11px] font-semibold mb-1" style="color:var(--text-tertiary)">무엇이 바뀌나 (${rows.length}건)</p>
    ${rows.length ? `<div>${rows.join("")}</div>` : `<p class="text-[12px]" style="color:var(--text-tertiary)">변경 항목이 없습니다</p>`}

    ${impactHtml(cr)}
    ${reviewed}

    ${canDecide ? `<div class="mt-4 pt-4 border-t" style="border-color:var(--border)">
      <input id="reject-reason-${cr.id}" placeholder="반려할 때는 이유를 적어주세요 (요청자에게 전달됩니다)"
        class="w-full border rounded-lg px-3 py-2 text-[13px] mb-2" style="border-color:var(--border)" />
      <div class="flex gap-2">
        <button onclick="decide('${cr.id}', true)" class="btn btn-primary !text-[13px]">합의하고 반영</button>
        <button onclick="decide('${cr.id}', false)" class="btn btn-secondary !text-[13px]" style="color:var(--red)">반려</button>
      </div>
    </div>` : ""}
  </div>`;
}

async function decide(crId, approve) {
  const commentEl = document.getElementById("reject-reason-" + crId);
  const comment = commentEl ? commentEl.value.trim() : "";
  if (!approve && !comment) {
    toastError("반려 이유를 적어주세요. 요청자가 무엇을 고쳐야 할지 알 수 있어야 합니다.");
    if (commentEl) commentEl.focus();
    return;
  }

  const { data: cr, error } = await sb.from("change_requests").select("*").eq("id", crId).single();
  if (error || !cr) { toastError("불러오기 실패"); return; }

  if (approve) {
    if (cr.proposed_changes && Object.keys(cr.proposed_changes).length) {
      const { error: gErr } = await sb.from("goals").update(cr.proposed_changes).eq("id", cr.goal_id);
      if (gErr) { toastError("목표 적용 실패: " + gErr.message); return; }
    }
    for (const [metricId, fields] of Object.entries(cr.proposed_metric_changes || {})) {
      const { error: mErr } = await sb.from("goal_metrics").update(fields).eq("id", metricId);
      if (mErr) { toastError("핵심지표 적용 실패: " + mErr.message); return; }
    }
    for (const [metricId, periods] of Object.entries(cr.proposed_period_target_changes || {})) {
      const rows = Object.entries(periods).map(([period, target_value]) => ({ goal_metric_id: metricId, period, target_value }));
      if (rows.length) {
        const { error: ptErr } = await sb.from("goal_period_targets").upsert(rows, { onConflict: "goal_metric_id,period" });
        if (ptErr) { toastError("월별/분기별 목표값 적용 실패: " + ptErr.message); return; }
      }
    }
  }
  const { error: crErr } = await sb.from("change_requests").update({
    status: approve ? "approved" : "rejected",
    reviewed_by: PROFILE.id,
    review_comment: comment || null,
    reviewed_at: new Date().toISOString()
  }).eq("id", crId);
  if (crErr) { toastError("처리 실패: " + crErr.message); return; }
  await load();
}
</script>
</body>
</html>
