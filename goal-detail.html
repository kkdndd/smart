<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>목표 상세 | 대교홀딩스 SMART</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="js/design.css" />
<script src="js/config.js"></script>
</head>
<body class="min-h-screen">
<div id="nav-root"></div>
<div class="max-w-4xl mx-auto px-4 py-6 space-y-4">
  <div class="flex items-center justify-between">
    <a href="goals.html" class="text-sm text-slate-500 hover:underline">← 목록으로</a>
    <div id="header-actions" class="flex gap-2"></div>
  </div>

  <div class="card p-6">
    <div class="flex items-center gap-2 mb-1">
      <h1 id="title" class="text-lg font-bold text-slate-800"></h1>
      <span id="status-badge" class="px-2 py-0.5 rounded-full text-xs"></span>
    </div>
    <p id="meta" class="text-xs text-slate-400 mb-4"></p>
    <dl class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
      <div><dt class="mb-1"><span class="inline-block px-2 py-0.5 rounded text-xs font-semibold" style="background:#EEF0F4;color:#3A4356">S · Specific</span></dt><dd id="f_specific" class="text-slate-700"></dd></div>
      <div><dt class="mb-1"><span class="inline-block px-2 py-0.5 rounded text-xs font-semibold" style="background:#EAF0F8;color:#4C6FA5">M · Measurable</span></dt><dd id="f_measurable" class="text-slate-700"></dd></div>
      <div><dt class="mb-1"><span class="inline-block px-2 py-0.5 rounded text-xs font-semibold" style="background:#E7F5EC;color:#2F9E5B">A · Achievable</span></dt><dd id="f_achievable" class="text-slate-700"></dd></div>
      <div><dt class="mb-1"><span class="inline-block px-2 py-0.5 rounded text-xs font-semibold" style="background:#FAF1DE;color:#C98A1F">R · Relevant</span></dt><dd id="f_relevant" class="text-slate-700"></dd></div>
      <div><dt class="mb-1"><span class="inline-block px-2 py-0.5 rounded text-xs font-semibold" style="background:#FBEAE7;color:#C94A3C">T · Time-bound</span></dt><dd id="f_timebound" class="text-slate-700"></dd></div>
      <div><dt class="mb-1"><span class="inline-block px-2 py-0.5 rounded text-xs font-semibold" style="background:#F0F0F2;color:#6E6E73">후속조치</span></dt><dd id="f_followup" class="text-slate-700"></dd></div>
    </dl>
  </div>

  <div class="card p-6">
    <h2 class="font-semibold text-slate-800 mb-3">핵심지표(KPI) 및 달성 현황</h2>
    <div id="metrics-root" class="space-y-3"></div>
  </div>

  <div class="card p-6">
    <h2 class="font-semibold text-slate-800 mb-3">검토/합의 이력</h2>
    <div id="reviews-root" class="space-y-2 text-sm"></div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/nav.js"></script>
<script>
let PROFILE, GOAL_ID = new URLSearchParams(location.search).get("id"), GOAL;

(async function init() {
  PROFILE = await requireAuth();
  if (!PROFILE) return;
  renderNav(PROFILE, "goals");
  await load();
})();

async function load() {
  const { data: goal, error } = await sb.from("goals").select("*, companies:company_id(name), business_units:business_unit_id(name)").eq("id", GOAL_ID).single();
  if (error || !goal) { document.body.innerHTML = "<p class='p-6 text-red-600'>목표를 불러올 수 없습니다.</p>"; return; }
  GOAL = goal;
  document.getElementById("title").textContent = goal.strategy_name;
  document.getElementById("status-badge").className = "px-2 py-0.5 rounded-full text-xs " + STATUS_BADGE_CLASS[goal.status];
  document.getElementById("status-badge").textContent = STATUS_LABEL[goal.status];
  // 관리번호는 사업부별로 매겨지므로 "2026년 강원심층수 영업 1번 목표" 형태로 읽히게 표기한다
  document.getElementById("meta").textContent =
    `${goal.year}년 · ${goal.companies.name} · ${goalRefLabel(goal)} 목표`;
  document.getElementById("f_specific").innerHTML = nl2br(goal.specific_text) || '-';
  document.getElementById("f_measurable").innerHTML = nl2br(goal.measurable_text) || '-';
  document.getElementById("f_achievable").innerHTML = nl2br(goal.achievable_text) || '-';
  document.getElementById("f_relevant").innerHTML = nl2br(goal.relevant_text) || '-';
  document.getElementById("f_timebound").innerHTML = nl2br(goal.timebound_text) || '-';
  document.getElementById("f_followup").innerHTML = nl2br(goal.follow_up_action) || '-';

  renderActions();
  await loadMetrics();
  await loadReviews();
}

function renderActions() {
  const actions = [];
  if (canEditGoal(PROFILE, GOAL)) {
    actions.push(`<a href="goal-form.html?id=${GOAL.id}" class="text-sm bg-[#3a4356] text-white rounded px-3 py-1.5">수정</a>`);
  }
  if (canWriteGoals(PROFILE) && (GOAL.status === "approved" || GOAL.status === "locked")) {
    actions.push(`<a href="change-requests.html?goal=${GOAL.id}" class="text-sm bg-white border border-slate-300 rounded px-3 py-1.5">변경요청</a>`);
  }
  actions.push(`<a href="progress.html?goal=${GOAL.id}" class="text-sm bg-white border border-slate-300 rounded px-3 py-1.5">진행실적 입력</a>`);
  // 제출취소: 사업부 담당자는 계열사 검토 전, 계열사 담당자는 지주사 검토 전까지 회수할 수 있다
  const canWithdraw = (isBuStaff(PROFILE) && GOAL.status === "submitted")
                   || (isCompanyStaff(PROFILE) && (GOAL.status === "submitted" || GOAL.status === "company_approved"));
  if (canWithdraw) {
    actions.push(`<button onclick="withdrawSubmission()" class="text-sm bg-white border border-red-300 text-red-600 rounded px-3 py-1.5">제출취소</button>`);
  }
  const canReviewNow = (isCompanyStaff(PROFILE) && GOAL.status === "submitted")
                    || (isHoldcoEditor(PROFILE) && GOAL.status === "company_approved");
  if (canReviewNow) {
    actions.push(`<a href="review.html?goal=${GOAL.id}" class="text-sm bg-blue-600 text-white rounded px-3 py-1.5">검토하기</a>`);
  }
  document.getElementById("header-actions").innerHTML = actions.join("");
}

async function withdrawSubmission() {
  // 지주사 검토 대기(company_approved)에서 회수하면 계열사 검토 단계로, 계열사 검토 대기에서 회수하면 임시저장으로 되돌린다
  const nextStatus = GOAL.status === "company_approved" ? "submitted" : "draft";
  const nextLabel = STATUS_LABEL[nextStatus];
  if (!confirm(`제출을 취소하고 '${nextLabel}' 상태로 되돌릴까요?`)) return;
  const { error: e1 } = await sb.from("goals").update({ status: nextStatus }).eq("id", GOAL.id);
  if (e1) { alert("취소 실패: " + e1.message); return; }
  const { error: e2 } = await sb.from("goal_reviews").insert({ goal_id: GOAL.id, action: "withdraw", reviewer_id: PROFILE.id, comment: "담당자 제출취소" });
  if (e2) console.error(e2);
  await load();
}

// 전년 실적 한 줄 요약 (비교할 데이터가 없으면 아무것도 그리지 않는다)
function prevYearHtml(m, summary) {
  const p = m.kpi_definition_id ? summary[m.kpi_definition_id] : null;
  if (!p) return "";
  const unit = p.unit || m.unit || "";
  const parts = [];
  if (p.target !== null && p.target !== undefined) parts.push(`목표 ${Number(p.target).toLocaleString()}${unit}`);
  if (p.actual !== null && p.actual !== undefined) {
    const actualText = typeof p.actual === "number" ? Number(p.actual).toLocaleString() + unit : p.actual;
    parts.push(`실적 ${actualText}${p.period ? ` (${p.period})` : ""}`);
  }
  if (p.rate !== null && p.rate !== undefined) parts.push(`달성률 ${p.rate}%`);
  if (!parts.length) return "";
  return `<p class="text-[11px] mb-2 px-2 py-1 rounded inline-block" style="background:var(--surface-hover);color:var(--text-secondary)">
    <b>${p.year}년</b> ${parts.join(" · ")}${p.sameBu ? "" : " <span class='text-slate-400'>(다른 사업부 기준)</span>"}
  </p>`;
}

// 같은 KPI 기준정보를 쓰는 전년도 지표를 찾아 목표·실적을 요약한다.
// 지표명이 아니라 기준정보 id로 잇기 때문에, 그 사이 지표명이 바뀌었어도 연결이 유지된다.
async function loadPreviousYearSummary(metrics) {
  const defIds = metrics.map(m => m.kpi_definition_id).filter(Boolean);
  if (!defIds.length) return {};

  const { data: prevGoals } = await sb.from("goals").select("id, business_unit_id")
    .eq("year", GOAL.year - 1).eq("company_id", GOAL.company_id);
  if (!prevGoals || !prevGoals.length) return {};
  const buByGoal = {};
  prevGoals.forEach(g => { buByGoal[g.id] = g.business_unit_id; });

  const { data: prevMetrics } = await sb.from("goal_metrics").select("*")
    .in("goal_id", prevGoals.map(g => g.id))
    .in("kpi_definition_id", defIds);
  if (!prevMetrics || !prevMetrics.length) return {};

  // 같은 사업부의 지표를 우선 사용한다 (사업부가 다르면 비교 대상이 아님)
  const picked = {};
  prevMetrics.forEach(pm => {
    const sameBu = buByGoal[pm.goal_id] === GOAL.business_unit_id;
    const cur = picked[pm.kpi_definition_id];
    if (!cur || (sameBu && !cur._sameBu)) picked[pm.kpi_definition_id] = Object.assign({ _sameBu: sameBu }, pm);
  });

  const prevIds = Object.values(picked).map(p => p.id);
  const { data: prevProgress } = await sb.from("progress_entries").select("*").in("goal_metric_id", prevIds).order("period");
  const { data: prevPeriodTargets } = await sb.from("goal_period_targets").select("*").in("goal_metric_id", prevIds);

  const summary = {};
  Object.values(picked).forEach(pm => {
    const entries = (prevProgress || []).filter(p => p.goal_metric_id === pm.id);
    const last = entries[entries.length - 1];
    const ptMap = {};
    (prevPeriodTargets || []).forEach(pt => { if (pt.goal_metric_id === pm.id) ptMap[pt.period] = pt.target_value; });
    const rate = last ? calcAchievementRate(pm, last.actual_value, last.milestone_achieved, ptMap[last.period]) : null;
    summary[pm.kpi_definition_id] = {
      year: GOAL.year - 1,
      target: pm.target_value,
      unit: pm.unit,
      actual: last ? (last.milestone_achieved !== null ? (last.milestone_achieved ? "완료" : "미완료") : last.actual_value) : null,
      period: last ? last.period : null,
      rate,
      sameBu: pm._sameBu
    };
  });
  return summary;
}

async function loadMetrics() {
  const { data: metrics } = await sb.from("goal_metrics").select("*").eq("goal_id", GOAL_ID);
  const root = document.getElementById("metrics-root");
  if (!metrics || metrics.length === 0) { root.innerHTML = `<p class="text-sm text-slate-400">등록된 지표가 없습니다.</p>`; return; }

  const metricIds = metrics.map(m => m.id);
  const prevSummary = await loadPreviousYearSummary(metrics);
  const { data: progress } = await sb.from("progress_entries").select("*").in("goal_metric_id", metricIds).order("period", { ascending: true });
  const { data: periodTargets } = await sb.from("goal_period_targets").select("*").in("goal_metric_id", metricIds);
  const periodTargetsByKey = {};
  const metricsWithPeriodTargets = new Set();
  (periodTargets||[]).forEach(pt => {
    periodTargetsByKey[pt.goal_metric_id + "|" + pt.period] = pt.target_value;
    metricsWithPeriodTargets.add(pt.goal_metric_id);
  });

  root.innerHTML = metrics.map(m => {
    const entriesAsc = (progress||[]).filter(p => p.goal_metric_id === m.id);
    // 달성률은 집계 방식(합산/누적/평균)에 맞춰 연간 실적을 산출한 뒤 계산한다
    const periodTargetValues = periodsForYear(GOAL.year, m.period_type)
      .map(p => periodTargetsByKey[m.id + "|" + p]).filter(v => v !== undefined && v !== null);
    const rate = annualAchievementRate(m, entriesAsc, periodTargetValues);
    const pace = paceText(m, rate, GOAL.year);
    const isNumeric = (m.metric_type === 'increasing' || m.metric_type === 'decreasing');
    const history = entriesAsc.map(p => {
      const effTarget = periodTargetsByKey[m.id + "|" + p.period] ?? m.target_value;
      const targetDisplay = (isNumeric && effTarget !== null && effTarget !== undefined) ? ` <span class="text-slate-400 font-normal">/ 목표 ${effTarget}${m.unit||''}</span>` : '';
      return `
      <div class="px-3 py-1.5 border-b border-slate-100 last:border-b-0">
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-500">${p.period}</span>
          <span class="text-sm font-medium text-slate-800">${p.milestone_achieved!==null ? (p.milestone_achieved?'완료':'미완료') : (p.actual_value ?? '-')}${targetDisplay}</span>
        </div>
        ${p.note ? `<p class="text-xs text-slate-500 mt-0.5">${nl2br(p.note)}</p>` : ''}
      </div>`;
    }).join("");
    let targetHint;
    if (m.metric_type === 'milestone') targetHint = '완료 여부로 관리되는 정성 지표입니다';
    else if (m.metric_type === 'qualitative') targetHint = '담당자가 매 기간 진척도(%)를 자가평가하는 정성 지표입니다';
    else {
      const parts = [`기준값 ${m.baseline_value ?? '-'}`];
      if (m.target_value !== null && m.target_value !== undefined) parts.push(`연간 목표값 ${m.target_value}`);
      if (metricsWithPeriodTargets.has(m.id)) parts.push('기간별 목표값 설정됨');
      targetHint = parts.join(' → ') + ` ${m.unit || ''}`;
    }
    return `<div class="border border-slate-200 rounded p-3">
      <div class="flex items-center justify-between mb-1">
        <span class="font-medium text-sm text-slate-800">${escapeHtml(m.metric_name)} <span class="text-xs text-slate-400">(${METRIC_TYPE_LABEL[m.metric_type]} · ${m.period_type==='monthly'?'월별':'분기별'} · ${ACCUMULATION_SHORT[accumulationOf(m)]})</span></span>
        <span class="text-right">
          <span class="px-2 py-0.5 rounded-full text-xs ${rateColorClass(rate)}">${rate===null?'실적없음':rate+'%'}</span>
          ${pace ? `<span class="block text-[10px] text-slate-400 mt-0.5">${pace}</span>` : ''}
        </span>
      </div>
      <p class="text-xs text-slate-500 mb-2">${targetHint}</p>
      ${prevYearHtml(m, prevSummary)}
      ${m.metric_type === "milestone" ? milestoneTimelineHtml(m, entriesAsc) : chartBlockHtml(m)}
      <details class="mt-2">
        <summary class="text-xs text-slate-500 cursor-pointer">기간별 입력 내역</summary>
        <div class="rounded border border-slate-100 divide-y divide-slate-100 mt-1">${history || '<p class="text-xs text-slate-400 px-3 py-2">입력된 실적이 없습니다</p>'}</div>
      </details>
    </div>`;
  }).join("");

  // HTML을 붙인 뒤에 차트를 그린다 (canvas가 DOM에 있어야 하므로)
  metrics.forEach(m => {
    const entriesAsc = (progress||[]).filter(p => p.goal_metric_id === m.id);
    CHART_DATA[m.id] = buildChartData(m, entriesAsc, periodTargetsByKey);
    renderMetricChart(m.id, "cumulative");
  });
}

// ---- KPI 달성 차트 ----
// 목표·실적·달성률을 이중축으로 겹치면 축 스케일에 따라 해석이 달라지고, 달성률은 어차피 목표·실적에서 나온 값이라
// 같은 정보를 두 번 그리게 된다. 그래서 축을 하나만 쓰는 두 가지 관점(누적/월별)을 토글로 제공한다.
const CHART_DATA = {};
const CHART_INSTANCES = {};

// 마일스톤은 값이 아니라 완료 여부라 막대·선 차트가 의미가 없다. 기간별 완료 타임라인으로 보여준다.
function milestoneTimelineHtml(m, entries) {
  const periods = periodsForYear(GOAL.year, m.period_type);
  const byPeriod = {};
  entries.forEach(e => { byPeriod[e.period] = e.milestone_achieved; });
  const done = periods.filter(p => byPeriod[p] === true).length;
  return `<div class="rounded border border-slate-100 p-2 mb-2">
    <div class="flex items-center justify-between mb-1.5">
      <span class="text-[11px] text-slate-400">기간별 완료 현황</span>
      <span class="text-[11px] text-slate-500">${done} / ${periods.length} 완료</span>
    </div>
    <div class="flex flex-wrap gap-1.5">
      ${periods.map(p => {
        const v = byPeriod[p];
        const style = v === true ? "background:#e7f5ec;color:#2f9e5b;border-color:#2f9e5b"
                    : v === false ? "background:#fbeae7;color:#c94a3c;border-color:#e6b5ad"
                    : "background:transparent;color:#c7c7cc;border-color:#e5e5ea";
        return `<span class="text-[10px] px-1.5 py-0.5 rounded border" style="${style}">${periodShortLabel(p)}</span>`;
      }).join("")}
    </div>
  </div>`;
}

function chartBlockHtml(m) {
  if (m.metric_type === "milestone") return ""; // 별도 타임라인으로 렌더링
  return `<div class="rounded border border-slate-100 p-2 mb-2">
    <div class="flex items-center justify-between mb-1">
      <span class="text-[11px] text-slate-400" id="chart-note-${m.id}"></span>
      <div class="flex gap-1">
        <button type="button" onclick="renderMetricChart('${m.id}','cumulative')" data-mode="cumulative" data-metric="${m.id}"
          class="chart-tab text-[11px] px-2 py-0.5 rounded border border-slate-300">누적</button>
        <button type="button" onclick="renderMetricChart('${m.id}','monthly')" data-mode="monthly" data-metric="${m.id}"
          class="chart-tab text-[11px] px-2 py-0.5 rounded border border-slate-300">기간별</button>
      </div>
    </div>
    <div style="height:180px; position:relative"><canvas id="chart-${m.id}"></canvas></div>
  </div>`;
}

// 차트에 쓸 기간별 목표/실적을 정리한다
function buildChartData(m, entries, periodTargetsByKey) {
  const acc = accumulationOf(m);
  const periods = periodsForYear(GOAL.year, m.period_type);
  const actualByPeriod = {};
  entries.forEach(e => {
    if (m.metric_type === "qualitative" || m.metric_type === "increasing" || m.metric_type === "decreasing") {
      if (e.actual_value !== null && e.actual_value !== undefined) actualByPeriod[e.period] = Number(e.actual_value);
    }
  });

  const hasPeriodTargets = periods.some(p => periodTargetsByKey[m.id + "|" + p] !== undefined);
  const annual = (m.target_value !== null && m.target_value !== undefined) ? Number(m.target_value) : null;

  let targets, targetNote = "";
  if (hasPeriodTargets) {
    targets = periods.map(p => {
      const v = periodTargetsByKey[m.id + "|" + p];
      return (v === undefined || v === null) ? null : Number(v);
    });
    targetNote = "기간별 목표값 기준";
  } else if (annual !== null) {
    // 기간별 목표가 없으면 연간 목표로 참고선을 만든다 (실제 설정값이 아님을 명시)
    // 집계 방식마다 "그 시점의 목표"가 다르다: 합산형은 균등 배분, 누적형은 균등 진행, 평균형은 같은 수준 유지
    if (acc === "latest") {
      targets = periods.map((_, i) => Math.round((annual * (i + 1) / periods.length) * 100) / 100);
      targetNote = "연간 목표까지 균등 진행(참고)";
    } else if (acc === "average") {
      targets = periods.map(() => annual);
      targetNote = "연간 목표 수준 유지(참고)";
    } else {
      targets = periods.map(() => Math.round((annual / periods.length) * 100) / 100);
      targetNote = "연간 목표 균등 배분(참고)";
    }
  } else {
    targets = periods.map(() => null);
    targetNote = "";
  }

  // 실적이 입력되지 않은 기간은 null로 두어 그래프에 찍지 않는다 (0으로 그리면 미달성으로 오해됨)
  const actuals = periods.map(p => (p in actualByPeriod) ? actualByPeriod[p] : null);
  const lastIdx = actuals.reduce((acc, v, i) => (v !== null ? i : acc), -1);

  // 집계 방식에 따라 "누적" 관점의 값이 달라진다.
  //  · 합산형: 입력값을 더해 나간다
  //  · 누적형: 입력값 자체가 이미 누적이므로 그대로 쓴다 (더하면 중복 집계가 된다)
  //  · 평균형: 그 시점까지의 평균을 본다
  const running = (arr, limitIdx) => {
    if (acc === "latest") {
      return arr.map((v, i) => (limitIdx !== undefined && i > limitIdx) ? null : v);
    }
    let sum = 0, count = 0;
    return arr.map((v, i) => {
      if (limitIdx !== undefined && i > limitIdx) return null;
      if (v !== null && v !== undefined) { sum += v; count++; }
      if (acc === "average") return count ? Math.round((sum / count) * 1000) / 1000 : null;
      return Math.round(sum * 1000) / 1000;
    });
  };

  return {
    periods, targets, actuals, annual, targetNote, lastIdx,
    accumulation: acc,
    cumTargets: targets.every(t => t === null) ? periods.map(() => null) : running(targets),
    cumActuals: lastIdx < 0 ? periods.map(() => null) : running(actuals, lastIdx),
    unit: m.unit || "",
    metricType: m.metric_type,
    hasAnyTarget: hasPeriodTargets || annual !== null
  };
}

function periodShortLabel(period) {
  const mm = period.match(/-(\d{2})$/);
  if (mm) return `${parseInt(mm[1], 10)}월`;
  const q = period.match(/-Q(\d)$/);
  return q ? `${q[1]}Q` : period;
}

// 집계 방식에 따라 "누적" 관점의 이름이 달라진다
function runningLabel(acc, base) {
  if (acc === "latest") return base;            // 입력값 자체가 누적이라 그대로가 추이
  if (acc === "average") return "평균 " + base;
  return "누적 " + base;
}

function renderMetricChart(metricId, mode) {
  const d = CHART_DATA[metricId];
  const canvas = document.getElementById("chart-" + metricId);
  if (!d || !canvas || !window.Chart) return;

  document.querySelectorAll(`.chart-tab[data-metric="${metricId}"]`).forEach(b => {
    const on = b.dataset.mode === mode;
    b.style.background = on ? "var(--accent-soft)" : "transparent";
    b.style.color = on ? "var(--accent)" : "var(--text-secondary)";
    b.style.fontWeight = on ? "600" : "400";
  });

  const noteEl = document.getElementById("chart-note-" + metricId);
  if (noteEl) {
    noteEl.textContent = !d.hasAnyTarget
      ? "목표값을 입력하면 목표선이 표시됩니다"
      : (mode === "cumulative" ? `누적 · ${d.targetNote}` : `기간별 · ${d.targetNote}`);
  }

  if (CHART_INSTANCES[metricId]) CHART_INSTANCES[metricId].destroy();

  // 감소형은 실적이 목표보다 낮아야 좋은 지표라 색 기준을 반대로 잡는다
  const good = "#2f9e5b", bad = "#c94a3c", targetColor = "#8e8e93";
  const labels = d.periods.map(periodShortLabel);
  const fmt = (v) => v === null ? "-" : Number(v).toLocaleString() + (d.unit ? " " + d.unit : "");

  let config;
  if (d.metricType === "qualitative") {
    config = {
      type: "line",
      data: { labels, datasets: [{ label: "진척도(%)", data: d.actuals, borderColor: good, backgroundColor: good, tension: .3, spanGaps: false }] },
      options: baseOptions(fmt, { suggestedMin: 0, suggestedMax: 100 })
    };
  } else if (mode === "cumulative") {
    config = {
      type: "line",
      data: {
        labels,
        datasets: [
          { label: runningLabel(d.accumulation, "목표"), data: d.cumTargets, borderColor: targetColor, borderDash: d.targetNote.includes("참고") ? [5, 4] : [], pointRadius: 0, tension: .2, spanGaps: true },
          { label: runningLabel(d.accumulation, "실적"), data: d.cumActuals, borderColor: good, backgroundColor: "rgba(47,158,91,.08)", fill: true, tension: .2, spanGaps: false }
        ].concat(
          // 기간별 목표의 합이 연간 목표와 다를 때만 연간 목표 기준선을 따로 그린다 (같으면 누적 목표선과 겹침)
          (d.annual !== null && Math.abs((d.cumTargets[d.cumTargets.length - 1] ?? 0) - d.annual) > 0.001)
            ? [{ label: `연간 목표 ${d.annual.toLocaleString()}`, data: d.periods.map(() => d.annual),
                 borderColor: "#c98a1f", borderDash: [3, 3], borderWidth: 1, pointRadius: 0, fill: false }]
            : []
        )
      },
      options: baseOptions(fmt)
    };
  } else {
    const barColors = d.actuals.map((v, i) => {
      const t = d.targets[i];
      if (v === null || t === null || t === undefined) return "#4c6fa5";
      const ok = d.metricType === "decreasing" ? v <= t : v >= t;
      return ok ? good : bad;
    });
    config = {
      type: "bar",
      data: {
        labels,
        datasets: [
          { label: "목표", data: d.targets, backgroundColor: "#d7dae0", borderRadius: 2 },
          { label: "실적", data: d.actuals, backgroundColor: barColors, borderRadius: 2 }
        ]
      },
      options: baseOptions(fmt)
    };
  }
  CHART_INSTANCES[metricId] = new Chart(canvas.getContext("2d"), config);
}

function baseOptions(fmt, scaleExtra) {
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { display: true, labels: { boxWidth: 10, font: { size: 10 } } },
      tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` } }
    },
    scales: {
      x: { ticks: { font: { size: 10 } }, grid: { display: false } },
      y: Object.assign({ beginAtZero: true, ticks: { font: { size: 10 } } }, scaleExtra || {})
    }
  };
}

async function loadReviews() {
  const { data: reviews } = await sb.from("goal_reviews").select("*, reviewer:reviewer_id(name,email)").eq("goal_id", GOAL_ID).order("created_at", { ascending: false });
  const root = document.getElementById("reviews-root");
  const labelMap = REVIEW_ACTION_LABEL;
  root.innerHTML = (reviews||[]).map(r => `
    <div class="flex items-start gap-2 border-b border-slate-100 pb-2">
      <span class="text-xs text-slate-400 whitespace-nowrap">${new Date(r.created_at).toLocaleString('ko-KR')}</span>
      <span class="font-medium">${labelMap[r.action]||r.action}</span>
      <span class="text-slate-500">${r.reviewer ? escapeHtml(r.reviewer.name||r.reviewer.email) : ''}</span>
      <span class="text-slate-600">${escapeHtml(r.comment||'')}</span>
    </div>`).join("") || `<p class="text-sm text-slate-400">이력이 없습니다.</p>`;
}
