<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비밀번호 변경 | 대교홀딩스 SMART</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="js/design.css" />
<script src="js/config.js"></script>
</head>
<body class="min-h-screen">
<div id="nav-root"></div>
<div class="max-w-md mx-auto px-4 py-10">
  <div id="first-notice" class="hidden mb-4 rounded-lg border border-amber-300 bg-amber-50 p-4">
    <p class="text-sm font-semibold text-amber-800 mb-1">초기 비밀번호를 변경해주세요</p>
    <p class="text-xs text-amber-700 leading-relaxed">
      관리자가 발급한 초기 비밀번호로 로그인하셨습니다. 보안을 위해 본인만 아는 비밀번호로 변경해야
      시스템을 이용할 수 있습니다.
    </p>
  </div>

  <div class="card p-6">
    <h1 class="text-lg font-bold text-slate-800 mb-1" id="page-title">비밀번호 변경</h1>
    <p class="text-xs text-slate-500 mb-5" id="account-line"></p>

    <form id="form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="current">현재 비밀번호</label>
        <input type="password" id="current" required autocomplete="current-password"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="pw1">새 비밀번호</label>
        <input type="password" id="pw1" required autocomplete="new-password"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
        <p class="text-[11px] text-slate-400 mt-1">8자 이상, 영문·숫자·특수문자 중 2종류 이상을 섞어주세요.</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="pw2">새 비밀번호 확인</label>
        <input type="password" id="pw2" required autocomplete="new-password"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
      </div>

      <p id="msg" class="text-sm hidden"></p>

      <div class="flex gap-2 pt-1">
        <button type="submit" id="submit-btn" class="bg-[#3a4356] text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-[#2c3342]">변경하기</button>
        <a href="dashboard.html" id="cancel-link" class="self-center text-sm text-slate-500 hover:underline ml-auto">취소</a>
      </div>
    </form>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/nav.js"></script>
<script>
let PROFILE, FIRST_TIME = false;

(async function init() {
  // 이 페이지 자체는 비밀번호 변경 강제 이동의 예외 대상이다 (무한 리다이렉트 방지)
  PROFILE = await requireAuth({ skipPasswordGate: true });
  if (!PROFILE) return;

  FIRST_TIME = PROFILE.must_change_password === true;
  document.getElementById("account-line").textContent = `${PROFILE.email} · ${roleLabel(PROFILE.role)}`;

  if (FIRST_TIME) {
    // 초기 비밀번호 변경 전에는 다른 화면으로 빠져나갈 수 없게 한다
    document.getElementById("first-notice").classList.remove("hidden");
    document.getElementById("page-title").textContent = "초기 비밀번호 변경";
    document.getElementById("cancel-link").remove();
    document.getElementById("nav-root").remove();
    document.body.classList.remove("has-sidebar");
  } else {
    renderNav(PROFILE, "password");
  }
})();

function showMsg(text, isError) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "text-sm " + (isError ? "text-red-600" : "text-green-600");
  el.classList.remove("hidden");
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit-btn");
  const current = document.getElementById("current").value;
  const pw1 = document.getElementById("pw1").value;
  const pw2 = document.getElementById("pw2").value;

  if (pw1 !== pw2) { showMsg("새 비밀번호가 서로 일치하지 않습니다.", true); return; }
  const invalid = validateNewPassword(pw1);
  if (invalid) { showMsg(invalid, true); return; }
  if (pw1 === current) { showMsg("현재 비밀번호와 다른 비밀번호로 설정해주세요.", true); return; }

  btn.disabled = true;
  btn.textContent = "변경 중...";
  try {
    // 본인 확인: 현재 비밀번호로 재로그인해서 맞는지 검증한다
    const { error: signInErr } = await sb.auth.signInWithPassword({ email: PROFILE.email, password: current });
    if (signInErr) { showMsg("현재 비밀번호가 올바르지 않습니다.", true); return; }

    const { error: updErr } = await sb.auth.updateUser({ password: pw1 });
    if (updErr) { showMsg("변경 실패: " + updErr.message, true); return; }

    await markPasswordChanged(PROFILE.id);

    showMsg("비밀번호를 변경했습니다. 잠시 후 이동합니다.", false);
    setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
  } finally {
    btn.disabled = false;
    btn.textContent = "변경하기";
  }
});
</script>
</body>
</html>
