<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사업계획 목표 | 대교홀딩스 SMART</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="js/design.css" />
<script src="js/config.js"></script>
</head>
<body class="min-h-screen">
<div id="nav-root"></div>
<div class="max-w-6xl mx-auto px-4 py-6">
  <div class="flex items-center justify-between mb-4 gap-3 flex-wrap">
    <div class="flex items-center gap-2 flex-wrap">
      <h1 class="text-lg font-bold text-slate-800" id="page-title"></h1>
      <div id="company-filter" class="hidden items-center gap-2 bg-amber-50 border border-amber-300 rounded-lg pl-3 pr-2 py-1">
        <label for="company-select" class="text-xs font-semibold text-amber-700 whitespace-nowrap">회사</label>
        <select id="company-select" class="border border-amber-300 rounded px-2 py-1 text-sm font-semibold text-amber-800 bg-white"></select>
      </div>
      <div id="bu-filter" class="hidden items-center gap-2 bg-slate-50 border border-slate-300 rounded-lg pl-3 pr-2 py-1">
        <label for="bu-select" class="text-xs font-semibold text-slate-500 whitespace-nowrap">사업부</label>
        <select id="bu-select" class="border border-slate-300 rounded px-2 py-1 text-sm font-medium text-slate-700 bg-white"></select>
      </div>
    </div>
    <button id="new-btn" class="bg-[#3a4356] text-white text-sm rounded px-4 py-2 hover:bg-[#2c3342]">+ 새 목표 작성</button>
  </div>
  <div class="card overflow-x-auto">
    <table class="w-full">
      <thead><tr class="text-left text-xs text-slate-400 border-b border-slate-200">
        <th class="py-2 px-3">#</th><th class="py-2 px-3 whitespace-nowrap">사업부</th><th class="py-2 px-3">전략(목표)</th>
        <th class="py-2 px-3">지표</th>
        <th class="py-2 px-3">Specific (무엇을 할지)</th>
        <th class="py-2 px-3 whitespace-nowrap">상태</th><th class="py-2 px-3">최근 검토 의견</th><th class="py-2 px-3"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/nav.js"></script>
<script>
let PROFILE, COMPANIES = [], SELECTED_COMPANY_ID = null, SELECTED_BU_ID = "";
(async function init() {
  PROFILE = await requireAuth();
  if (!PROFILE) return;
  renderNav(PROFILE, "goals");
  document.getElementById("page-title").textContent = `${getSelectedYear()}년 사업계획 목표`;
  document.getElementById("new-btn").classList.toggle("hidden", !canWriteGoals(PROFILE));

  if (isHoldco(PROFILE)) {
    // 지주사 담당자/경영진은 특정 회사에 소속되지 않으므로, 계열사를 드롭다운으로 골라서 조회한다
    const { data: companies } = await sb.from("companies").select("*").order("is_holding", { ascending: false }).order("name");
    // 선택한 사업연도에 표시 대상인 계열사만 목록에 올린다 (표시 기간이 지난 계열사는 그 이후 연도에서 제외)
    COMPANIES = (companies || []).filter(c => isVisibleInYear(c, getSelectedYear()));
    SELECTED_COMPANY_ID = COMPANIES[0] ? COMPANIES[0].id : null;
    const sel = document.getElementById("company-select");
    sel.innerHTML = COMPANIES.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
    sel.addEventListener("change", async () => { SELECTED_COMPANY_ID = sel.value; SELECTED_BU_ID = ""; await loadBuFilter(); loadGoals(); });
    showFilter("company-filter");
  } else {
    SELECTED_COMPANY_ID = PROFILE.company_id;
  }

  await loadBuFilter();
  await loadGoals();
})();

function showFilter(id) {
  const el = document.getElementById(id);
  el.classList.remove("hidden");
  el.classList.add("flex");
}

// 사업부 필터: 계열사·지주사 담당자는 회사 전체 사업부 중에서, 겸직 중인 사업부 담당자는 본인 담당 사업부 중에서 고른다
async function loadBuFilter() {
  const sel = document.getElementById("bu-select");
  let options = [];
  if (isBuStaff(PROFILE)) {
    if ((PROFILE.business_units || []).length < 2) return; // 담당 사업부가 하나뿐이면 필터가 불필요
    options = [...PROFILE.business_units].sort((a, b) => a.name.localeCompare(b.name, "ko"));
  } else {
    if (!SELECTED_COMPANY_ID) return;
    const { data } = await sb.from("business_units")
      .select("id,name,is_active,active_from_year,active_to_year")
      .eq("company_id", SELECTED_COMPANY_ID).order("name");
    options = (data || []).filter(b => isVisibleInYear(b, getSelectedYear()));
  }
  sel.innerHTML = `<option value="">전체 사업부</option>` + options.map(b => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join("");
  sel.value = SELECTED_BU_ID;
  sel.onchange = () => { SELECTED_BU_ID = sel.value; loadGoals(); };
  showFilter("bu-filter");
}

document.getElementById("new-btn").addEventListener("click", () => window.location.href = "goal-form.html");

async function loadGoals() {
  let q = sb.from("goals").select("*, business_units:business_unit_id(name)").eq("year", getSelectedYear());
  q = q.eq("company_id", SELECTED_COMPANY_ID || "___none___");
  if (SELECTED_BU_ID) q = q.eq("business_unit_id", SELECTED_BU_ID);
  const { data: rawGoals, error } = await q;
  if (error) { console.error(error); return; }

  // 관리번호가 사업부별로 1번부터 매겨지므로, 사업부로 묶은 뒤 번호 순으로 보여준다
  const goals = sortGoalsByBusinessUnit(rawGoals || []);

  const goalIds = (goals||[]).map(g=>g.id);
  let reviewsByGoal = {};
  if (goalIds.length) {
    const { data: reviews } = await sb.from("goal_reviews").select("*").in("goal_id", goalIds).order("created_at", { ascending: false });
    (reviews||[]).forEach(r => { if(!reviewsByGoal[r.goal_id]) reviewsByGoal[r.goal_id] = r; });
  }

  document.getElementById("rows").innerHTML = (goals||[]).map(g => {
    const lastReview = reviewsByGoal[g.id];
    const editable = canEditGoal(PROFILE, g);
    return `<tr class="border-b border-slate-100 cursor-pointer hover:bg-[var(--surface-hover)]" onclick="window.location.href='goal-detail.html?id=${g.id}'">
      <td class="py-2 px-3 text-sm">${g.seq_no ?? ''}</td>
      <td class="py-2 px-3 text-sm whitespace-nowrap">${escapeHtml(g.business_units ? g.business_units.name : '')}</td>
      <td class="py-2 px-3 text-sm font-medium text-slate-800">${escapeHtml(g.strategy_name)}</td>
      <td class="py-2 px-3 text-xs text-slate-600">${escapeHtml(g.indicator_name) || '<span class="text-slate-300">-</span>'}</td>
      <td class="py-2 px-3 text-xs text-slate-600 max-w-xs"><span class="line-clamp-2">${nl2br(g.specific_text) || '<span class=\"text-slate-300\">-</span>'}</span></td>
      <td class="py-2 px-3 text-sm whitespace-nowrap"><span class="px-2 py-0.5 rounded-full text-xs whitespace-nowrap ${STATUS_BADGE_CLASS[g.status]}">${STATUS_LABEL[g.status]}</span></td>
      <td class="py-2 px-3 text-xs text-slate-500 max-w-xs">${lastReview ? escapeHtml(lastReview.comment||'') : ''}</td>
      <td class="py-2 px-3 text-sm text-right whitespace-nowrap" onclick="event.stopPropagation()">
        <a href="goal-detail.html?id=${g.id}" class="text-slate-500 hover:underline mr-3">상세</a>
        ${editable ? `<a href="goal-form.html?id=${g.id}" class="text-slate-800 font-medium hover:underline">수정</a>` : ''}
      </td>
    </tr>`;
  }).join("") || `<tr><td colspan="8" class="py-8 text-center text-slate-400 text-sm">등록된 목표가 없습니다.${canWriteGoals(PROFILE) ? " '새 목표 작성'으로 시작하세요." : ""}</td></tr>`;
}
</script>
</body>
</html>
