<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비밀번호 재설정</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="js/design.css" />
<script src="js/config.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm card p-8">
    <h1 class="text-lg font-bold text-slate-800 mb-1">새 비밀번호 설정</h1>
    <p class="text-xs text-slate-500 mb-4">앞으로 로그인에 사용할 비밀번호를 입력해주세요.</p>
    <form id="form" class="space-y-3">
      <input type="password" id="password" required placeholder="새 비밀번호" autocomplete="new-password"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
      <input type="password" id="password2" required placeholder="새 비밀번호 확인" autocomplete="new-password"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
      <p class="text-[11px] text-slate-400">8자 이상, 영문·숫자·특수문자 중 2종류 이상을 섞어주세요.</p>
      <p id="msg" class="text-sm hidden"></p>
      <button class="w-full bg-[#3a4356] text-white rounded-lg py-2 text-sm font-medium">변경하기</button>
    </form>
  </div>
<script src="js/common.js"></script>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = document.getElementById("password").value;
  const password2 = document.getElementById("password2").value;
  const msg = document.getElementById("msg");
  const show = (text, isError) => {
    msg.className = "text-sm " + (isError ? "text-red-600" : "text-green-600");
    msg.textContent = text;
    msg.classList.remove("hidden");
  };

  if (password !== password2) { show("새 비밀번호가 서로 일치하지 않습니다.", true); return; }
  const invalid = validateNewPassword(password);
  if (invalid) { show(invalid, true); return; }

  const { error } = await sb.auth.updateUser({ password });
  if (error) { show("변경 실패: " + error.message, true); return; }

  // 이메일 링크로 직접 비밀번호를 설정한 경우이므로, 최초 로그인 시 변경 요구를 해제한다
  const { data: { user } } = await sb.auth.getUser();
  if (user) await markPasswordChanged(user.id);

  show("변경되었습니다. 다시 로그인해주세요.", false);
  setTimeout(() => window.location.href = "index.html", 1500);
});
</script>
</body>
</html>
